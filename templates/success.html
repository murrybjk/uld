<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Successful - ULD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 16px;
            animation: bounce 0.6s ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .file-item {
            background: #f8f9ff;
            border: 1px solid #e0e7ff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .file-url {
            width: 100%;
            text-align: left;
        }

        .file-url label {
            display: block;
            color: #999;
            font-size: 12px;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .file-url a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
            word-break: break-all;
            transition: all 0.3s;
            font-weight: 500;
        }

        .file-url a:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .copy-icon {
            cursor: pointer;
            flex-shrink: 0;
        }

        .qr-code {
            padding: 12px;
            background: white;
            border-radius: 6px;
        }

        .qr-code img {
            width: 200px;
            height: 200px;
            image-rendering: pixelated;
        }

        .qr-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        a.button, button {
            flex: 1;
            min-width: 150px;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .button-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .button-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .button-secondary {
            background: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }

        .button-secondary:hover {
            background: #efefef;
            border-color: #999;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }

            .qr-code img {
                width: 160px;
                height: 160px;
            }

            .file-item {
                padding: 16px;
            }

            .actions {
                flex-direction: column;
            }

            a.button, button {
                min-width: auto;
            }
        }

        .tooltip {
            position: relative;
            display: inline-block;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 120px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -60px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 12px;
            white-space: nowrap;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>
        <h1>Upload Successful!</h1>
        <p class="subtitle">Your files are ready to download</p>

        {% for file_url, qr_code in files %}
            <div class="file-item">
                <div class="file-url">
                    <label>Download Link</label>
                    <a href="{{ file_url }}" target="_blank" title="Click to download">
                        <span>📥 {{ file_url.split('/')[-1] }}</span>
                        <span class="copy-icon tooltip" onclick="copyToClipboard('{{ file_url }}')">
                            📋
                            <span class="tooltiptext">Copy link</span>
                        </span>
                    </a>
                </div>

                <div>
                    <div class="qr-label">📱 Scan to Download</div>
                    <div class="qr-code">
                        <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code">
                    </div>
                </div>
            </div>
        {% endfor %}

        <div class="actions">
            <a href="/" class="button button-primary">📤 Upload More Files</a>
        </div>
    </div>

    <script>
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Link copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }
    </script>
</body>
</html>
